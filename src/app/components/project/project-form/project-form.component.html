<form (ngSubmit)="onSubmit()" #projectForm="ngForm" class="p-3">
    <div class="mb-4">
        <label for="title" class="form-label fw-bold small text-uppercase text-muted">Project Title</label>
        <input type="text" class="form-control border-0 bg-light py-2 px-3 shadow-none focus-primary" id="title" name="title" [(ngModel)]="project.title" required placeholder="Enter project title">
    </div>

    <div class="mb-4">
        <label for="description" class="form-label fw-bold small text-uppercase text-muted">Description</label>
        <textarea class="form-control border-0 bg-light py-2 px-3 shadow-none focus-primary" id="description" name="description" rows="4" [(ngModel)]="project.description" required placeholder="Tell us about the project..."></textarea>
    </div>

    <div class="row">
        <div class="col-md-6 mb-4">
            <label for="aiCategory" class="form-label fw-bold small text-uppercase text-muted">AI Category</label>
            <input type="text" class="form-control border-0 bg-light py-2 px-3 shadow-none focus-primary" id="aiCategory" name="aiCategory" [(ngModel)]="project.aiCategory" required placeholder="e.g. Computer Vision, NLP">
        </div>
        <div class="col-md-6 mb-4">
            <label for="domain" class="form-label fw-bold small text-uppercase text-muted">Domain</label>
            <select class="form-select border-0 bg-light py-2 px-3 shadow-none focus-primary" id="domain" name="domain" 
                    [(ngModel)]="selectedDomainId" required>
                <option value="" disabled selected>Select a domain...</option>
                <option *ngFor="let domain of allDomains()" [ngValue]="domain.id">{{ domain.name }}</option>
            </select>
        </div>
    </div>

    <div class="mb-4">
        <label class="form-label fw-bold small text-uppercase text-muted">Collaborating Researchers</label>
        
        <div class="tag-input-container position-relative">
            <div class="selected-tags d-flex flex-wrap gap-2 mb-2">
                <span *ngFor="let res of selectedResearchers()" class="badge bg-primary-soft text-primary d-flex align-items-center py-2 px-3 rounded-pill">
                    {{ res.fullName || 'Researcher' }}
                    <i class="bi bi-x-lg ms-2 cursor-pointer" (click)="removeResearcher(res.id!)"></i>
                </span>
            </div>
            
            <input type="text" class="form-control border-0 bg-light py-2 px-3 shadow-none focus-primary rounded-pill mb-2" 
                   placeholder="Type to search researchers..." 
                   [(ngModel)]="searchQuery" name="searchQuery" 
                   (input)="onSearchChange()">

            <div *ngIf="filteredResearchers().length > 0" class="search-results shadow-lg rounded-3 border-0 mt-1 position-absolute w-100 bg-white z-3 overflow-hidden">
                <div *ngFor="let res of filteredResearchers()" 
                     class="search-item p-3 d-flex align-items-center cursor-pointer hover-bg-light" 
                     (click)="addResearcher(res)">
                    <div class="avatar-sm bg-primary-soft text-primary rounded-circle me-3 d-flex align-items-center justify-content-center fw-bold">
                        {{ res.fullName ? res.fullName.charAt(0).toUpperCase() : 'R' }}
                    </div>
                    <div>
                        <div class="fw-bold">{{ res.fullName }}</div>
                        <div class="small text-muted">{{ res.affiliation }}</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="d-flex gap-2 pt-3">
        <button type="submit" class="btn btn-primary rounded-pill px-5 py-2 fw-bold flex-grow-1 shadow-sm" [disabled]="!projectForm.form.valid">
            <i class="bi bi-check-lg me-2"></i>Create Project
        </button>
        <button type="button" class="btn btn-light rounded-pill px-4 py-2 fw-semibold" (click)="projectForm.reset()">
            Reset
        </button>
    </div>
</form>
