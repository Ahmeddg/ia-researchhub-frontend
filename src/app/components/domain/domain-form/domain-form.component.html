<form (ngSubmit)="onSubmit()" #domainForm="ngForm" class="p-3">
    <div class="mb-4">
        <label for="name" class="form-label fw-bold small text-uppercase text-muted">Domain Name</label>
        <input type="text"
               class="form-control border-0 bg-light py-2 px-3 shadow-none focus-primary"
               id="name"
               name="name"
               [(ngModel)]="formDomain.name"
               placeholder="Enter domain name..."
               maxlength="100"
               required>
    </div>

    <div class="mb-4">
        <label for="description" class="form-label fw-bold small text-uppercase text-muted">Description</label>
        <textarea class="form-control border-0 bg-light py-2 px-3 shadow-none focus-primary"
                  id="description"
                  name="description"
                  [(ngModel)]="formDomain.description"
                  placeholder="Enter domain description..."
                  rows="4"
                  maxlength="500"
                  required></textarea>
    </div>

    <div class="d-flex gap-2 pt-3">
        <button type="submit"
                class="btn btn-primary rounded-pill px-5 py-2 fw-bold flex-grow-1 shadow-sm"
                [disabled]="isSubmitting || !domainForm.valid || !formDomain.name.trim() || !formDomain.description.trim()">
            <i class="bi bi-check-lg me-2"></i>
            <span *ngIf="!isSubmitting">{{ isEditMode ? 'Update Domain' : 'Create Domain' }}</span>
            <span *ngIf="isSubmitting">
                <span class="spinner-border spinner-border-sm me-2"></span>Processing...
            </span>
        </button>
        <button type="button" class="btn btn-light rounded-pill px-4 py-2 fw-semibold" (click)="resetForm()" [disabled]="isSubmitting">
            Reset
        </button>
    </div>
</form>
