<form (ngSubmit)="onSubmit()" #domainForm="ngForm">
    <div class="mb-3">
        <label for="name" class="form-label">Domain Name</label>
        <input type="text" 
               class="form-control" 
               id="name" 
               name="name" 
               [(ngModel)]="formDomain.name" 
               placeholder="Enter domain name..."
               maxlength="100"
               required>
    </div>

    <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <textarea class="form-control" 
                  id="description" 
                  name="description" 
                  [(ngModel)]="formDomain.description"
                  placeholder="Enter domain description..."
                  rows="4"
                  maxlength="500"
                  required></textarea>
    </div>

    <div class="d-flex gap-2">
        <button type="submit" 
                class="btn btn-primary" 
                [disabled]="isSubmitting || !domainForm.valid || !formDomain.name.trim() || !formDomain.description.trim()">
            <span *ngIf="!isSubmitting">{{ isEditMode ? 'Update Domain' : 'Save Domain' }}</span>
            <span *ngIf="isSubmitting">
                <span class="spinner-border spinner-border-sm me-2"></span>Processing...
            </span>
        </button>
        <button type="button" class="btn btn-secondary" (click)="resetForm()" [disabled]="isSubmitting">
            Reset
        </button>
    </div>
</form>
