<div class="container py-5">
    <div class="row g-4">
        <!-- Role Management Column -->
        <div class="col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 h-100">
                <div class="card-header bg-white border-0 py-4 px-4">
                    <h4 class="fw-bold mb-0">System Roles</h4>
                </div>
                <div class="card-body px-4">
                    <div class="input-group mb-4">
                        <input type="text" class="form-control bg-light border-0 py-3 ps-4 rounded-start-pill shadow-none" 
                               placeholder="Enter new role name..." [(ngModel)]="newRoleName">
                        <button class="btn btn-primary px-4 rounded-end-pill fw-bold" (click)="addRole()">
                            <i class="bi bi-plus-lg me-2"></i>Add
                        </button>
                    </div>

                    <div class="list-group list-group-flush">
                        <div *ngFor="let role of roles()" class="list-group-item border-0 bg-light rounded-3 mb-2 d-flex justify-content-between align-items-center py-3 px-4">
                            <div>
                                <span class="fw-semibold">{{ role.name.replace('ROLE_', '') }}</span>
                            </div>
                            <button class="btn btn-link text-danger p-0" (click)="deleteRole(role.id!)">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- User Role Assignment Column -->
        <div class="col-lg-7">
            <div class="card border-0 shadow-sm rounded-4 h-100">
                <div class="card-header bg-white border-0 py-4 px-4">
                    <h4 class="fw-bold mb-0">User Role Management</h4>
                </div>
                <div class="card-body px-4">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle border-light">
                            <thead class="bg-light">
                                <tr>
                                    <th class="border-0 py-3 ps-4">User</th>
                                    <th class="border-0 py-3 text-center">Current Roles</th>
                                    <th class="border-0 py-3 text-end pe-4">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let user of users()">
                                    <td class="py-3 ps-4">
                                        <div class="fw-semibold">{{ user.username }}</div>
                                        <div class="small text-muted">{{ user.email }}</div>
                                    </td>
                                    <td class="text-center">
                                        <div class="d-flex flex-wrap gap-1 justify-content-center">
                                            <span *ngFor="let role of user.roles" class="badge bg-primary-soft text-primary small">
                                                {{ role.replace('ROLE_', '') }}
                                            </span>
                                        </div>
                                    </td>
                                    <td class="text-end pe-4">
                                        <button class="btn btn-sm btn-outline-primary rounded-pill px-3" 
                                                (click)="selectUser(user)" data-bs-toggle="modal" data-bs-target="#editRolesModal">
                                            Edit Roles
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Edit Roles Modal -->
<div class="modal fade" id="editRolesModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">
            <div class="modal-header border-0 pt-4 px-4 pb-0">
                <h5 class="modal-title fw-bold">Edit Roles for {{ selectedUser()?.username }}</h5>
                <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <p class="text-muted small mb-4">Select the roles you want to assign to this user:</p>
                <div class="row g-3">
                    <div *ngFor="let role of roles()" class="col-6">
                        <div class="role-selector p-3 rounded-3 border-2 transition-all cursor-pointer" 
                             [ngClass]="selectedUserRoles().includes(role.name) ? 'border-primary bg-primary-soft' : 'border-light bg-light'"
                             (click)="toggleUserRole(role.name)">
                            <div class="form-check m-0">
                                <input class="form-check-input" type="checkbox" 
                                       [checked]="selectedUserRoles().includes(role.name)" (click)="$event.stopPropagation()">
                                <label class="form-check-label fw-semibold ms-2">
                                    {{ role.name.replace('ROLE_', '') }}
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer border-0 p-4">
                <button type="button" class="btn btn-light rounded-pill px-4 fw-semibold" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary rounded-pill px-5 fw-bold" (click)="saveUserRoles()">Save Changes</button>
            </div>
        </div>
    </div>
</div>
